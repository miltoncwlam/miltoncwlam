name: CI

on:
  push:
    branches: [main, milton, rico, ai-flashcard]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test
          NEXT_PUBLIC_VERCEL_ENV: ""
      - run: npm run typecheck
